<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>managers dashboard</title>
    <link rel="stylesheet" href="styling/manager.css">
</head>
<body>
    
    <header class="dashboard-header">  <h1>Food Share Managers Dashboard</h1></header>
    <main class="dashboard">
        <section class="form-section">
            <h2>Add New Menu Item</h2>
            <form class="menu-form">
                <input type="text" id="food-text" placeholder="Food name" required>
                <input type="number" id="food-price" placeholder="Price" required>
                <input type="text" id="food-category" placeholder="Category" required>
                <input type="text" id="food-image" placeholder="Image path" required>
                <button type="submit">Add Menu</button>
            </form>
        </section>
        <section class="menu-section">
            <h2>Current Menu</h2>
            <div class="menu-list"></div>
        </section>
    </main>
  
    
<script src="scripts/manegers.js"></script>
</body>
</html>
