<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>checkout</title>
    <link rel="stylesheet" href="../styling/order.css">
</head>
<body>
    <h1 class="ch">checkout</h1>
    <form action="" id="checkout-form">
    <label for="full-name">Full Name</label>
    <input type="text" placeholder="enter your full names" id="full-name">

    <label for="phone">Phone number</label>
    <input type="tel" placeholder="enter your number" id="phone">

    <label for="address">Delivery Address</label>
    <textarea  id="address" placeholder="Enter your address"></textarea >
    <label for="payment">Payment Method</label>
    <select id="payment">
        <option value="">cash on Delivery</option>
        <option value="">Mobile money</option>
        <option value="">Bank</option>
    </select>
    <button type="submit" class="checkout-Btn">Confirm order</button>
    </form>
    <script src="../scripts/checkout.js"></script>
</body>
</html>
